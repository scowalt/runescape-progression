when:
  - event: [push, pull_request, tag]

labels:
  ci_os: linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
      recursive: false
      lfs: false
      tags: true
      merge-pull-request: true
      git-user-name: Woodpecker CI
      git-user-email: ci@woodpecker.local

steps:
  - name: fetch-all-branch-and-tag-history
    image: alpine/git:2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
    environment:
      RUNESCAPE_CI_READ_KEY:
        from_secret: runescape_ci_read_key
    commands:
      - sh scripts/ci/fetch-scan-refs.sh

  - name: scan-full-history
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - test "$(gitleaks version)" = "v8.30.1"
      - timeout -k 15 600 gitleaks git --redact
