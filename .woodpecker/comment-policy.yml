when:
  - event: [push, pull_request, tag]

labels:
  ci_os: linux

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
      recursive: false
      lfs: false
      merge-pull-request: true
      git-user-name: Woodpecker CI
      git-user-email: ci@woodpecker.local

steps:
  - name: comment-policy-and-adapters
    image: ghcr.io/astral-sh/uv:0.11.32-python3.14-trixie@sha256:adafbab0c780d8bd995039e9dfd800f95a057867d283deee7d5eb1b3126551b2
    commands:
      - >-
        timeout --kill-after=15s 10m sh -ec '
        uv run --no-project --python 3.14 --with-requirements .comment-policy/requirements.txt python .comment-policy/check.py;
        uv run --no-project --python 3.14 --with-requirements .comment-policy/requirements.txt python -m unittest discover -s .comment-policy -p "test_*.py"'
